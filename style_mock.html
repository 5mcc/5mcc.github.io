<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Artsy Style Preview – Revised</title>
<style>

/* === base === */

body {
    margin: 0;
    font-family: "Source Sans 3", Inter, system-ui, sans-serif;
    background-color: #f7f8f6;
    color: #222;
    line-height: 1.7;
}

main {
    max-width: 42rem;
    margin: auto;
    padding: 3rem 1rem;
}

/* === brush strokes (rotating colors) === */

h2 {
    position: relative;
    font-size: 1.35rem;
    margin-bottom: 1.8rem; /* more space */
}

h2::after {
    content: "";
    position: absolute;
    left: 0;
    bottom: -0.6em; /* more distance from text */
    width: 3.6rem;
    height: 0.45em;
    border-radius: 8px;
    z-index: -1;
}

/* color rotation */
h2:nth-of-type(5n+1)::after { background: rgba(112,180,127,0.45); } /* sage */
h2:nth-of-type(5n+2)::after { background: rgba(255,182,193,0.55); } /* rose */
h2:nth-of-type(5n+3)::after { background: rgba(118,89,135,0.45); } /* violet */
h2:nth-of-type(5n+4)::after { background: rgba(218,165,32,0.45); }  /* ochre */
h2:nth-of-type(5n+5)::after { background: rgba(120,160,200,0.45); } /* blue */

/* === wave glow background (stronger, clearer) === */

.wave-bg {
    position: relative;
    padding: 1.5rem 0;
}

.wave-bg::before {
    content: "";
    position: absolute;
    left: -30%;
    top: -20%;
    width: 160%;
    height: 160%;
    background: radial-gradient(
        ellipse at center,
        rgba(112,180,127,0.22),
        transparent 68%
    );
    z-index: -1;
}

/* === sinus wave divider === */

.wave-divider {
    width: 100%;
    height: 22px;
    margin: 3.5rem 0;
}

.wave-divider svg {
    width: 100%;
    height: 100%;
}

.wave-divider path {
    fill: none;
    stroke: #d28c6c;
    stroke-width: 1.5;
}

/* === card (unchanged but fits style) === */

.card {
    background: #ffffff;
    border-radius: 14px;
    padding: 1.4rem 1.6rem;
    box-shadow: 0 10px 25px rgba(0,0,0,0.06);
    border-left: 4px solid #765987;
}

</style>
</head>

<body>
<main>

    <section class="wave-bg">
        <h2>About the Project</h2>
        <p>
            The wave glow should now be clearly visible, but still soft.
            It wraps the whole section, not just the header.
        </p>
    </section>

    <div class="wave-divider">
        <svg viewBox="0 0 200 20" preserveAspectRatio="none">
            <path d="M0 10 Q 25 0 50 10 T 100 10 T 150 10 T 200 10" />
        </svg>
    </div>

    <section>
        <h2>Approach</h2>
        <div class="card">
            <p>
                Brush strokes rotate through colors.
                Dividers feel musical, not decorative.
            </p>
        </div>

    <!-- Add this between sections where you want waves -->
    <div class="wave-divider deep-1">
    <svg viewBox="0 0 1200 48" preserveAspectRatio="none">
        <path d="M0,24 C300,0 400,48 600,24 C800,0 900,48 1200,24 L1200,48 L0,48 Z"></path>
    </svg>
    </div>

    <div class="wave-divider deep-2">
    <svg viewBox="0 0 1200 48" preserveAspectRatio="none">
        <path d="M0,24 C150,36 300,12 450,24 C600,36 750,12 900,24 C1050,36 1200,12 1200,24 L1200,48 L0,48 Z"></path>
    </svg>
    </div>

    <div class="wave-divider deep-3">
    <svg viewBox="0 0 1200 48" preserveAspectRatio="none">
        <path d="M0,24 C200,8 400,40 600,24 C800,8 1000,40 1200,24 L1200,48 L0,48 Z"></path>
    </svg>
    </div>

    <div class="wave-divider deep-4">
    <svg viewBox="0 0 1200 48" preserveAspectRatio="none">
        <path d="M0,24 C250,4 350,44 600,24 C850,4 950,44 1200,24 L1200,48 L0,48 Z"></path>
    </svg>
    </div>
    </section>

</main>
</body>
</html>
